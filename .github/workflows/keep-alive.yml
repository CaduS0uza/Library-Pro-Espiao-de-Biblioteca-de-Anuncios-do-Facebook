name: keep-alive (Supabase)

# Mantém o projeto Supabase do LibPro ATIVO pra não pausar por inatividade
# (plano free pausa após ~7 dias sem atividade). Roda a cada 2 dias na infra do
# GitHub e faz uma leitura mínima no banco via REST — independente do Vercel.
#
# Ele NÃO funciona sem os secrets SUPABASE_URL e SUPABASE_KEY no repositório.
# Entre 17/07 e 17/08/2026 rodou 17 vezes e falhou 17, porque os secrets nunca
# foram cadastrados — foi assim que o banco pausou e o login parou de entrar.
on:
  schedule:
    - cron: "17 9 */2 * *" # a cada 2 dias, 09:17 UTC
  workflow_dispatch: {} # dispara manualmente pra testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Cutuca o banco (SELECT numa tabela real = atividade que evita a pausa)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -u
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "::error::defina os secrets SUPABASE_URL e SUPABASE_KEY no repo"; exit 1
          fi
          # Consulta uma tabela de verdade: obriga o PostgREST a abrir conexão no
          # Postgres. RLS bloqueia as linhas pra chave anon, então volta 200 [] —
          # atividade real no banco, zero dado exposto.
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/app_users?select=email&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"
          head -c 300 /tmp/r.txt; echo
          # Só 200 conta. Um 401 vem do gateway ANTES de tocar o Postgres — daria
          # verde sem gerar atividade nenhuma, e o projeto pausaria do mesmo jeito.
          case "$code" in
            200) echo "ok — banco ativo, pausa evitada" ;;
            000) echo "::error::host não respondeu — projeto Supabase PAUSADO ou apagado. Restaure no dashboard."; exit 1 ;;
            401|403) echo "::error::chave recusada (HTTP $code) — o secret SUPABASE_KEY está errado. Use a anon key (eyJ...)."; exit 1 ;;
            521|522|523|524) echo "::error::gateway de pé mas Postgres fora (HTTP $code) — projeto restaurando ou caído."; exit 1 ;;
            *) echo "::error::banco não respondeu (HTTP $code)"; exit 1 ;;
          esac
